name: supplyed-frontend-dev

services:
  frontend:
    build:
      context: ./current
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set}
    container_name: supplyed-frontend-dev
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3000}
    network_mode: host
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const port=process.env.PORT||'3000'; fetch('http://127.0.0.1:'+port+'/manifest.webmanifest').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
